<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CityPulse — Your City. One Pulse.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ============ LEAFLET CORE (inlined, trimmed) ============ */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane > svg,.leaflet-pane > canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;background:#0d1526}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;-moz-box-sizing:border-box;box-sizing:border-box;z-index:800}
.leaflet-overlay-pane svg,.leaflet-overlay-pane canvas{-moz-user-select:none}
.leaflet-pane{z-index:400}
.leaflet-tile-pane{z-index:200}
.leaflet-overlay-pane{z-index:400}
.leaflet-shadow-pane{z-index:500}
.leaflet-marker-pane{z-index:600}
.leaflet-tooltip-pane{z-index:650}
.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}
.leaflet-map-pane svg{z-index:200}
.leaflet-vml-shape{width:1px;height:1px}
.lvml{behavior:url(#default#VML);display:inline-block;position:absolute}
.leaflet-control{position:relative;z-index:800;pointer-events:visiblePainted;pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{float:left;clear:both}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:12px}
.leaflet-bottom .leaflet-control{margin-bottom:12px}
.leaflet-left .leaflet-control{margin-left:12px}
.leaflet-right .leaflet-control{margin-right:12px}
.leaflet-fade-anim .leaflet-popup{opacity:0;-webkit-transition:opacity .2s linear;-moz-transition:opacity .2s linear;-o-transition:opacity .2s linear;transition:opacity .2s linear}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-zoom-animated{-webkit-transform-origin:0 0;-ms-transform-origin:0 0;transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{-webkit-transition:-webkit-transform .25s cubic-bezier(0,0,.25,1);-moz-transition:-moz-transform .25s cubic-bezier(0,0,.25,1);-o-transition:-o-transform .25s cubic-bezier(0,0,.25,1);transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:-webkit-grab;cursor:-moz-grab;cursor:grab}
.leaflet-crosshair,.leaflet-crosshair .leaflet-interactive{cursor:crosshair}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:14px;background:#0F1A3D;color:#EAF0FF;box-shadow:0 12px 28px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08)}
.leaflet-popup-content{margin:0;line-height:1.4;min-width:240px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:#0F1A3D}
.leaflet-popup-close-button{display:none}
.leaflet-control-zoom{border-radius:10px !important;overflow:hidden}
.leaflet-control-zoom a{background:#0F1A3D !important;color:#EAF0FF !important;border-bottom:1px solid rgba(255,255,255,.08) !important;width:32px !important;height:32px !important;line-height:32px !important}
.leaflet-control-attribution{background:rgba(10,17,40,.75) !important;color:#8A93A6 !important;font-size:10px !important;padding:2px 8px !important;border-radius:6px 0 0 0}
.leaflet-control-attribution a{color:#9fb4ff !important}
.leaflet-marker-icon.cp-marker{background:none;border:none}

/* ============ DESIGN TOKENS ============ */
:root{
  --navy:#080D1F; --navy2:#0E1738; --panel:#10193C; --panel2:#141F49;
  --paper:#F4F7FC; --ink:#0A0F22;
  --teal:#19C7AE; --teal-d:#0E8E7C; --blue:#4C82FF; --amber:#F0A83D; --red:#EF5350; --grape:#9B7BFF;
  --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.05);
  --txt:#EAF0FF; --txt-dim:#9AA6C8; --txt-faint:#6C7699;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--navy);color:var(--txt);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::selection{background:var(--teal);color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#233066;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.bg-grid{position:fixed;inset:0;z-index:-1;background-image:
  radial-gradient(circle at 15% 8%, rgba(76,130,255,.12), transparent 40%),
  radial-gradient(circle at 85% 92%, rgba(25,199,174,.10), transparent 45%),
  linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:auto,auto,42px 42px,42px 42px; background-color:var(--navy);}

/* ---------- NAV ---------- */
.topnav{position:sticky;top:0;z-index:500;backdrop-filter:blur(14px);background:rgba(8,13,31,.86);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:12px 22px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.2px;flex-shrink:0}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(25,199,174,.18)}
.navwrap{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.navlinks{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.navlinks::-webkit-scrollbar{display:none}
.navscroll{display:none;flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--txt-dim);align-items:center;justify-content:center;font-size:15px;z-index:2}
.navscroll.show{display:flex}
.navscroll:hover{color:var(--txt);background:rgba(255,255,255,.08)}
.navscroll-l{margin-right:4px}
.navscroll-r{margin-left:4px}
.navlinks button{background:none;border:none;color:var(--txt-dim);font-size:13.5px;font-weight:500;padding:9px 12px;border-radius:9px;white-space:nowrap;transition:.15s;flex-shrink:0}
.navlinks button:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.navlinks button.active{color:var(--ink);background:var(--teal)}
.nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.loc-select{background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:12.5px;padding:7px 10px;border-radius:9px}
.icon-btn{position:relative;width:34px;height:34px;border-radius:9px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--txt-dim);font-size:15px}
.icon-btn:hover{color:var(--txt)}
.badge-dot{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.navburger{display:none}

/* ---------- STATUS BAR ---------- */
.statusbar{background:var(--navy2);border-bottom:1px solid var(--line);font-size:12px;color:var(--txt-dim)}
.statusbar-inner{max-width:1440px;margin:0 auto;padding:7px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-family:var(--mono)}
.pulse-live{display:flex;align-items:center;gap:6px;color:var(--teal);font-weight:600}
.pulse-live .p{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(25,199,174,.55)}70%{box-shadow:0 0 0 7px rgba(25,199,174,0)}100%{box-shadow:0 0 0 0 rgba(25,199,174,0)}}
.sb-sep{color:var(--line)}
.sb-item b{color:var(--txt)}

/* ---------- LAYOUT ---------- */
.view{display:none;max-width:1440px;margin:0 auto;padding:28px 22px 70px}
.view.active{display:block;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{color:var(--teal);font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;margin:0 0 6px}
h1.pagetitle{font-family:var(--disp);font-size:30px;margin:0 0 6px;font-weight:700}
.pagesub{color:var(--txt-dim);font-size:14.5px;margin:0 0 26px;max-width:640px;line-height:1.55}

/* ---------- CARD ---------- */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.card-tight{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:980px){.g4,.g6{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}}

.source-tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:20px;font-weight:600;letter-spacing:.02em}
.src-live{background:rgba(25,199,174,.14);color:var(--teal)}
.src-sim{background:rgba(154,166,200,.14);color:var(--txt-dim)}
.src-user{background:rgba(76,130,255,.14);color:var(--blue)}
.src-ai{background:rgba(155,123,255,.16);color:var(--grape)}
.src-delay{background:rgba(240,168,61,.15);color:var(--amber)}
.source-tag .d{width:6px;height:6px;border-radius:50%;background:currentColor}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13.5px;border-radius:10px;border:1px solid transparent;padding:10px 18px;transition:.15s}
.btn-primary{background:var(--teal);color:var(--ink)}
.btn-primary:hover{background:#28d8bd}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--txt)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:#5f8fff}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px}
.pill-good{background:rgba(25,199,174,.15);color:var(--teal)}
.pill-warn{background:rgba(240,168,61,.15);color:var(--amber)}
.pill-bad{background:rgba(239,83,80,.15);color:var(--red)}
.pill-info{background:rgba(76,130,255,.15);color:var(--blue)}

/* ---------- HERO ---------- */
.hero{padding:56px 0 40px;text-align:center;border-bottom:1px solid var(--line-soft);margin-bottom:34px}
.hero h1{font-family:var(--disp);font-size:clamp(40px,7vw,72px);font-weight:700;line-height:1;margin:0 0 10px;letter-spacing:-1px}
.hero .tag{font-family:var(--disp);font-size:18px;color:var(--teal);margin:0 0 18px;font-weight:600}
.hero p{color:var(--txt-dim);max-width:560px;margin:0 auto 30px;font-size:15px;line-height:1.6}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---------- GAUGE ---------- */
.gaugewrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.gauge{position:relative;width:168px;height:168px;flex-shrink:0}
.gauge svg{transform:rotate(-90deg)}
.gauge-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-num .n{font-family:var(--disp);font-size:38px;font-weight:700;line-height:1}
.gauge-num .of{font-size:11px;color:var(--txt-faint)}
.catbar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:13px}
.catbar-row .lbl{width:110px;flex-shrink:0;color:var(--txt-dim)}
.catbar-track{flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden}
.catbar-fill{height:100%;border-radius:6px}
.catbar-row .val{width:34px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--txt)}

/* ---------- STAT CARD ---------- */
.statcard{cursor:default}
.statcard .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.statcard .label{font-size:12.5px;color:var(--txt-dim);font-weight:600}
.statcard .value{font-family:var(--disp);font-size:27px;font-weight:700;margin:2px 0}
.statcard .meta{font-size:12px;color:var(--txt-faint);display:flex;align-items:center;gap:6px}
.trend-up{color:var(--red)}.trend-down{color:var(--teal)}.trend-flat{color:var(--txt-faint)}

/* ---------- ACTIVITY FEED ---------- */
.activity-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px;animation:slidein .4s ease}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.activity-item:last-child{border-bottom:none}
.activity-item .t{font-family:var(--mono);color:var(--txt-faint);font-size:11px;flex-shrink:0;width:46px;padding-top:1px}
.activity-item .dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}

/* ---------- MAP PAGE ---------- */
.map-layout{display:grid;grid-template-columns:250px 1fr;gap:16px;height:calc(100vh - 210px);min-height:560px}
@media(max-width:980px){.map-layout{grid-template-columns:1fr;height:auto}}
.filter-panel{overflow-y:auto}
.filter-group{margin-bottom:18px}
.filter-group h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-faint);margin:0 0 10px}
.chk-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;cursor:pointer;user-select:none}
.chk-row input{accent-color:var(--teal);width:15px;height:15px}
#mapel{width:100%;height:100%;border-radius:var(--r-lg);border:1px solid var(--line)}
.map-wrap{position:relative}
.map-toolbar{position:absolute;top:12px;left:12px;z-index:900;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.map-toolbar input{background:rgba(15,23,55,.92);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 12px;font-size:13px;width:210px}
.map-toolbar .btn{background:rgba(15,23,55,.92)}
.legend-float{position:absolute;bottom:12px;left:12px;z-index:900;background:rgba(15,23,55,.92);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:11.5px;display:flex;flex-direction:column;gap:5px}
.legend-float .li{display:flex;align-items:center;gap:7px}

.infopanel{position:absolute;top:12px;right:12px;z-index:900;width:280px;max-width:calc(100% - 24px)}

/* ---------- FORMS ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--txt-dim);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--navy2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 13px;font-size:13.5px}
.field textarea{resize:vertical;min-height:90px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--navy2);color:var(--txt-dim);padding:8px 14px;border-radius:20px;font-size:13px}
.chip.sel{background:var(--teal);color:var(--ink);border-color:var(--teal);font-weight:600}
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;color:var(--txt-dim);cursor:pointer;transition:.15s}
.dropzone:hover{border-color:var(--teal);color:var(--teal)}

/* ---------- CHAT ---------- */
.chatwrap{display:flex;flex-direction:column;height:64vh;min-height:440px}
.chatlog{flex:1;overflow-y:auto;padding:6px 4px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:12px 15px;border-radius:14px;font-size:13.5px;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--navy2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .datatag{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--txt-faint);display:flex;gap:14px;flex-wrap:wrap}
.chatinput{display:flex;gap:10px;margin-top:14px}
.chatinput input{flex:1;background:var(--navy2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 16px;font-size:13.5px}
.suggestrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.suggestrow button{background:var(--navy2);border:1px solid var(--line);color:var(--txt-dim);padding:7px 12px;border-radius:20px;font-size:12px}
.suggestrow button:hover{border-color:var(--teal);color:var(--teal)}

/* ---------- TOASTS / NOTIFICATIONS ---------- */
.toaststack{position:fixed;top:80px;right:18px;z-index:2000;display:flex;flex-direction:column;gap:10px;width:320px;max-width:calc(100vw - 30px)}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px;padding:13px 15px;box-shadow:0 14px 34px rgba(0,0,0,.4);animation:toastin .3s ease}
@keyframes toastin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.toast .th{font-weight:700;font-size:13px;margin-bottom:3px;display:flex;justify-content:space-between}
.toast .tb{font-size:12.5px;color:var(--txt-dim);line-height:1.4}
.toast .tx{cursor:pointer;color:var(--txt-faint);font-size:15px;background:none;border:none}

.notifdrawer{position:fixed;top:0;right:-380px;width:360px;height:100vh;background:var(--navy2);border-left:1px solid var(--line);z-index:1900;transition:right .25s ease;padding:20px;overflow-y:auto}
.notifdrawer.open{right:0}
.notif-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-soft);font-size:13px;cursor:pointer}
.notif-item:hover{background:rgba(255,255,255,.03)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1800;display:none}
.scrim.show{display:block}

/* ---------- MISC ---------- */
.divider{height:1px;background:var(--line);margin:22px 0}
.section-title{font-family:var(--disp);font-size:20px;font-weight:700;margin:0 0 4px}
.section-sub{color:var(--txt-dim);font-size:13.5px;margin:0 0 18px}
.flow-step{display:flex;align-items:center;gap:10px;color:var(--txt-dim);font-size:13px}
.flow-arrow{color:var(--txt-faint);font-size:15px}
.linkchain{display:flex;flex-direction:column;gap:0;align-items:flex-start}
.linkchain .lc-node{background:var(--navy2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px}
.linkchain .lc-arrow{color:var(--teal);font-family:var(--mono);font-size:13px;padding:6px 0 6px 20px}
.evidence-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.evidence-row:last-child{border-bottom:none}
.replaybar{display:flex;align-items:center;gap:14px;margin:18px 0}
.replay-slider{flex:1;accent-color:var(--teal)}
.speedbtns{display:flex;gap:6px}
.speedbtns button{padding:5px 10px;font-size:12px;border-radius:7px;background:var(--navy2);border:1px solid var(--line);color:var(--txt-dim)}
.speedbtns button.sel{background:var(--teal);color:var(--ink);border-color:var(--teal)}
.timeline-track{position:relative;height:6px;background:rgba(255,255,255,.08);border-radius:4px;margin:8px 0 4px}
.timeline-fill{position:absolute;left:0;top:0;height:100%;background:var(--teal);border-radius:4px}
.timeline-marks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--txt-faint)}
.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}

/* =========================================================================
   CITYPULSE — client-side civic intelligence demo
   Live: Open-Meteo (weather), OpenStreetMap (map tiles)
   Everything else (reports, hazards, traffic, AQI, alerts, AI, links)
   is a clearly-labeled simulated layer, per the app's own honesty rules.

const LOCATIONS = {
  jaipur:  {name:'Jaipur, Rajasthan',  lat:26.9124, lon:75.7873},
  delhi:   {name:'Delhi',              lat:28.6139, lon:77.2090},

};

const ZONE_OFFSETS = [ // relative lat/lon jitter for mock zone placement around a city center
  {zone:'Sector 4', dx:0.018, dy:0.012}, {zone:'Sector 7', dx:-0.02, dy:0.02},
  {zone:'Main Road', dx:0.005, dy:-0.015}, {zone:'MI Road', dx:-0.012,dy:-0.006},
  {zone:'Zone 2', dx:0.025,dy:-0.01}, {zone:'Civil Lines', dx:-0.022,dy:0.008}
];

const nowStr = ()=> new Date().toLocaleTimeString('en-GB',{hour12:false});
const pad = n => String(n).padStart(2,'0');
const uid = ()=> Math.random().toString(36).slice(2,8);
const rand = (a,b)=> a + Math.random()*(b-a);
const choice = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------------------------- GLOBAL STATE ---------------------------- */
const DB = {
  locKey:'jaipur',
  loc: LOCATIONS.jaipur,
  weather:null,             // filled by fetchWeather
  weatherSource:'SIMULATED',
  weatherUpdated:null,
  feedsHealthy:0,
  civic:{score:78,prevScore:81,cats:{
    'Road Safety':74,'Traffic':61,'Environment':80,'Infrastructure':70,'Citizen Reports':83
  }},
  hazards:[], reports:[], alerts:[], activity:[], insights:[],
  hourly:null, // 24h synthetic series
  demoMode:false,
  notifications:[],
  reportCounter:4821,
};

let map, markerLayers = {}, infoPanelMarker=null;
let charts = {};

/* ---------------------------- SEED MOCK DATA ---------------------------- */
function seedHazards(){
  const types = [
    {t:'Open Manhole', icon:'🔴', sev:'HIGH', src:'AI Detection + Citizen Reports'},
    {t:'Pothole', icon:'🟠', sev:'MEDIUM', src:'AI Detection'},
    {t:'Traffic', icon:'🔵', sev:'MEDIUM', src:'Traffic Feed'},
    {t:'Waterlogging', icon:'💧', sev:'HIGH', src:'Citizen Reports'},
    {t:'Garbage', icon:'🟢', sev:'LOW', src:'Citizen Reports'},
    {t:'Streetlight', icon:'🟣', sev:'LOW', src:'Citizen Reports'},
    {t:'AI Hazard', icon:'⚠️', sev:'CRITICAL', src:'CityPulse Vision'},
  ];
  DB.hazards = [];
  for(let i=0;i<12;i++){
    const z = choice(ZONE_OFFSETS);
    const ty = choice(types);
    DB.hazards.push({
      id:'HZ-'+uid(), type:ty.t, icon:ty.icon, severity:ty.sev, source:ty.src,
      zone:z.zone, lat:DB.loc.lat+z.dy+rand(-.006,.006), lon:DB.loc.lon+z.dx+rand(-.006,.006),
      confidence: Math.round(rand(70,98)), reports:Math.round(rand(0,6)),
      detectedMinsAgo: Math.round(rand(2,180)), hour: Math.floor(rand(0,24))
    });
  }
}
function seedReports(){
  const types=['Open Manhole','Pothole','Flooding','Garbage','Broken Streetlight','Traffic Issue','Other'];
  DB.reports=[];
  for(let i=0;i<24;i++){
    const z=choice(ZONE_OFFSETS);
    DB.reports.push({

      lat:DB.loc.lat+z.dy+rand(-.008,.008), lon:DB.loc.lon+z.dx+rand(-.008,.008),
      status: choice(['VERIFIED','UNDER AI VERIFICATION','NEEDS REVIEW']),
      hour: Math.floor(rand(0,24)), desc:'Reported via CityPulse citizen app.'
    });
  }
}
function seedAlerts(){
  DB.alerts=[
    {id:'AL-'+uid(), location:'Sector 4', type:'Weather', condition:'Rainfall > 10 mm/hour', status:'ACTIVE', delivery:['In-app']},
    {id:'AL-'+uid(), location:'Main Road', type:'Traffic', condition:'Traffic delay > 40%', status:'ACTIVE', delivery:['In-app','Email']},

}
function seedInsights(){

function seedActivity(){

}
function seedHourly(){
  // 24 synthetic hourly points, used by Last 24 Hours + Replay
  const h = {temp:[],rain:[],traffic:[],reports:[],aqi:[],civic:[]};
  let t=22, r=0, tr=30, rp=0, aq=70, cv=82;
  for(let i=0;i<24;i++){
    t += rand(-1.2,1.4); r = clamp(r+rand(-1,2.2),0,14); tr = clamp(tr+rand(-4,6),15,95);
    rp += Math.round(rand(0,3)); aq = clamp(aq+rand(-4,5),35,160); cv = clamp(cv+rand(-2.5,1.5),50,95);
    h.temp.push(Math.round(t*10)/10); h.rain.push(Math.round(r*10)/10); h.traffic.push(Math.round(tr));
    h.reports.push(rp); h.aqi.push(Math.round(aq)); h.civic.push(Math.round(cv));
  }
  DB.hourly = h;
}

function seedAll(){ seedHazards(); seedReports(); seedAlerts(); seedInsights(); seedActivity(); seedHourly(); }

/* ---------------------------- LIVE WEATHER ---------------------------- */
async function fetchWeather(){
  try{
    const {lat,lon} = DB.loc;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,rain,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,visibility&hourly=temperature_2m,precipitation_probability&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('bad response');
    const j = await res.json();
    const c = j.current;
    DB.weather = {
      temp: Math.round(c.temperature_2m), feels: Math.round(c.apparent_temperature),
      rain: c.rain ?? c.precipitation ?? 0, humidity: c.relative_humidity_2m,
      wind: Math.round(c.wind_speed_10m), windDir: c.wind_direction_10m,
      cloud: c.cloud_cover, visibility: c.visibility ? Math.round(c.visibility/1000)+' km' : '—',
      condition: weatherCodeToText(c.weather_code),
      rainProb: j.hourly?.precipitation_probability?.[0] ?? Math.round(rand(10,45))
    };
    DB.weatherSource='LIVE';
    DB.weatherUpdated = new Date();
  }catch(e){
    // graceful fallback — clearly labeled simulated, never claimed live
    DB.weather = {
      temp: Math.round(rand(24,34)), feels: Math.round(rand(25,37)), rain: Math.round(rand(0,3)*10)/10,
      humidity: Math.round(rand(30,70)), wind: Math.round(rand(5,22)), windDir: Math.round(rand(0,360)),
      cloud: Math.round(rand(10,80)), visibility:'10 km', condition:'Partly Cloudy', rainProb: Math.round(rand(10,45))
    };
    DB.weatherSource='SIMULATED';
    DB.weatherUpdated = new Date();
  }
  refreshWeatherDependentUI();
}
function weatherCodeToText(code){
  const map = {0:'Clear Sky',1:'Mostly Clear',2:'Partly Cloudy',3:'Overcast',45:'Fog',48:'Fog',
   51:'Light Drizzle',53:'Drizzle',55:'Dense Drizzle',61:'Light Rain',63:'Rain',65:'Heavy Rain',
   71:'Light Snow',73:'Snow',75:'Heavy Snow',80:'Rain Showers',81:'Rain Showers',82:'Violent Showers',
   95:'Thunderstorm',96:'Thunderstorm w/ Hail',99:'Thunderstorm w/ Hail'};
  return map[code] || 'Mixed Conditions';
}

/* ---------------------------- FEEDS (status page) ---------------------------- */
function computeFeeds(){
  const feeds=[
    {name:'Weather', source:'Open-Meteo', status:DB.weatherSource==='LIVE'?'LIVE':'SIMULATED', updated: DB.weatherUpdated? timeAgo(DB.weatherUpdated):'—', type:'Environmental'},
    {name:'Map Data', source:'OpenStreetMap', status:'AVAILABLE', updated:'static tiles', type:'Geographic'},
    {name:'Citizen Reports', source:'CityPulse Database', status:'LIVE', updated:'just now', type:'User-generated'},
    {name:'AI Detection', source:'CityPulse Vision (simulated model)', status:'AVAILABLE', updated:'on demand', type:'AI Inference'},
    {name:'Traffic', source:'Demo Traffic Feed', status:'DELAYED', updated:'4 min ago', type:'Simulated'},
    {name:'Air Quality', source:'Demo AQI Feed', status:'SIMULATED', updated:'2 min ago', type:'Simulated'},
    {name:'Civic Data', source:'Demo Feed', status:'SIMULATED', updated:'—', type:'Simulated'},
  ];
  DB.feedsHealthy = feeds.filter(f=>f.status==='LIVE'||f.status==='AVAILABLE').length;
  return feeds;
}
function timeAgo(d){
  const s = Math.round((Date.now()-d.getTime())/1000);
  if(s<60) return s+' sec ago';
  return Math.round(s/60)+' min ago';
}

/* ---------------------------- ROUTING / VIEWS ---------------------------- */
const NAV = [
  ['home','Home'], ['map','Live Map'], ['links','Possible Links'], ['hours','Last 24 Hours'],
  ['replay','Replay'], ['alerts','Get Alerts'], ['feeds','Feed Status'], ['ai','AI Detection'],
  ['ask','Ask CityPulse'], ['report','Report Issue']
];
let currentView='home';

function go(view){
  currentView=view;
  document.querySelectorAll('.navlinks button').forEach(b=>b.classList.toggle('active', b.dataset.v===view));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+view));
  if(view==='map') setTimeout(()=>{ initMapIfNeeded(); map && map.invalidateSize(); },50);
  if(view==='hours') setTimeout(renderHoursCharts,30);
  if(view==='replay') setTimeout(initReplay,30);
  window.scrollTo({top:0,behavior:'instant'});
}

}

/* Desktop nav is horizontally scrollable when it doesn't fit — make that discoverable
   and usable: chevron buttons, vertical-wheel-to-horizontal, drag-to-scroll, and
   auto-hide the chevrons when there's nothing left to scroll to. */
function setupNavScroll(){
  const nl=document.getElementById('navlinks'), l=document.getElementById('navScrollL'), r=document.getElementById('navScrollR');
  if(!nl||!l||!r) return;
  const update=()=>{
    const overflow = nl.scrollWidth > nl.clientWidth+2;
    l.classList.toggle('show', overflow && nl.scrollLeft>4);
    r.classList.toggle('show', overflow && nl.scrollLeft < nl.scrollWidth-nl.clientWidth-4);
  };
  l.onclick=()=>nl.scrollBy({left:-160,behavior:'smooth'});
  r.onclick=()=>nl.scrollBy({left:160,behavior:'smooth'});
  nl.addEventListener('scroll', update);
  window.addEventListener('resize', update);
  nl.addEventListener('wheel', e=>{
    if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ nl.scrollLeft += e.deltaY; e.preventDefault(); }
  }, {passive:false});
  let dragging=false, startX=0, startScroll=0;
  nl.addEventListener('mousedown', e=>{ dragging=true; startX=e.pageX; startScroll=nl.scrollLeft; nl.style.cursor='grabbing'; });
  window.addEventListener('mouseup', ()=>{ dragging=false; nl.style.cursor=''; });
  window.addEventListener('mousemove', e=>{ if(!dragging) return; nl.scrollLeft = startScroll - (e.pageX-startX); });
  setTimeout(update,50);
}

function changeLocation(key){
  DB.locKey=key; DB.loc=LOCATIONS[key];
  seedAll();
  fetchWeather();
  pushActivity(`Location changed to ${DB.loc.name}`, 'var(--blue)');
  renderAll();

  // renderAll() rebuilds the map element, so initialize Leaflet against
  // the new element instead of trying to use the removed map instance.
  if(currentView==='map'){
    setTimeout(()=>{
      initMapIfNeeded();
      if(map){
        map.setView([DB.loc.lat,DB.loc.lon],14);
        map.invalidateSize(true);
        plotHazardsOnMap();
      }
    },80);
  }
}

function tickClock(){ renderStatusBar(); }
setInterval(tickClock, 1000);

/* ---------------------------- GAUGE SVG ---------------------------- */
function gaugeSvg(score){
  const r=70, c=2*Math.PI*r, off=c*(1-score/100);
  const color = score>=75?'var(--teal)':score>=50?'var(--amber)':'var(--red)';
  return `<svg width="168" height="168" viewBox="0 0 168 168">
    <circle cx="84" cy="84" r="${r}" stroke="rgba(255,255,255,.08)" stroke-width="14" fill="none"/>
    <circle cx="84" cy="84" r="${r}" stroke="${color}" stroke-width="14" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      style="transition:stroke-dashoffset 1s ease"/>
  </svg>`;
}
function statusLabel(score){ return score>=80?'GOOD': score>=60?'FAIR': score>=40?'POOR':'CRITICAL'; }

/* ---------------------------- HOME VIEW ---------------------------- */
function renderHome(){
  const el = document.getElementById('view-home'); if(!el) return;
  const c = DB.civic;
  const catColors = {'Road Safety':'var(--blue)','Traffic':'var(--amber)','Environment':'var(--teal)','Infrastructure':'var(--grape)','Citizen Reports':'var(--red)'};
  const w = DB.weather||{};
  const trend = c.score>=c.prevScore ? `<span class="trend-down">▲ ${(c.score-c.prevScore).toFixed(0)} vs earlier</span>` : `<span class="trend-up">▼ ${(c.prevScore-c.score).toFixed(0)} vs earlier</span>`;

  el.innerHTML = `
    <div class="hero">
      <div class="eyebrow">SEE THE CITY · UNDERSTAND THE SIGNALS · ACT ON WHAT MATTERS</div>

function initMapIfNeeded(){
  const elm = document.getElementById('mapel');
  if(!elm) return;
  if(typeof L === 'undefined'){
    console.error('Leaflet failed to load. Check your internet connection/CDN access.');
    elm.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#9AA6C8;font-size:13px;padding:20px;text-align:center">Map library could not load.<br>Check your internet connection and reload the page.</div>';
    return;
  }
  if(mapInitialized && map && map.getContainer()===elm){
    setTimeout(()=>map.invalidateSize(true),0);
    return;
  }

  if(map){
    try{ map.remove(); }catch(e){}
    map = null;
  }
  markerLayers = {};
  mapInitialized = false;

  map = L.map(elm, {zoomControl:true, preferCanvas:true}).setView([DB.loc.lat, DB.loc.lon], 14);

  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors',
    crossOrigin:true
  }).addTo(map);

  osm.on('tileerror', e => console.warn('OpenStreetMap tile failed:', e));

  markerLayers.group = L.layerGroup().addTo(map);
  mapInitialized = true;

  // Hidden tabs and freshly rendered containers can report the wrong size.
  setTimeout(()=>map && map.invalidateSize(true),0);
  setTimeout(()=>map && map.invalidateSize(true),150);

  plotHazardsOnMap();
}
function severityFromLabel(s){ return (s||'').toUpperCase(); }
function makeDivIcon(emoji){
  return L.divIcon({className:'cp-marker', html:`<div style="font-size:22px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))">${emoji}</div>`, iconSize:[26,26], iconAnchor:[13,13]});
}
function plotHazardsOnMap(){
  if(!map) return;
  markerLayers.group.clearLayers();
  const typeChecks = [...document.querySelectorAll('#typeFilters input')].filter(i=>i.checked).map(i=>i.dataset.type);
  const sevChecks = [...document.querySelectorAll('#sevFilters input')].filter(i=>i.checked).map(i=>i.dataset.sev);
  const timeVal = document.getElementById('timeFilter')?.value || '24';
  const maxAge = timeVal==='live'?15: parseInt(timeVal)*60;

  DB.hazards.forEach(h=>{
    if(!typeChecks.includes(h.type)) return;
    if(!sevChecks.includes(h.severity)) return;
    if(h.detectedMinsAgo>maxAge) return;
    const meta = MARKER_META[h.type]||{emoji:'⚠️'};
    const m = L.marker([h.lat,h.lon], {icon:makeDivIcon(meta.emoji)}).addTo(markerLayers.group);
    m.on('click', ()=> showInfoPanel(h));
  });
  DB.reports.forEach(r=>{
    if(!typeChecks.includes('Citizen Report')) return;
    const m = L.marker([r.lat,r.lon], {icon:makeDivIcon('🟡')}).addTo(markerLayers.group);
    m.on('click', ()=> showInfoPanel({type:'Citizen Report — '+r.type, zone:r.zone, severity:'MEDIUM', confidence:'—',
      reports:1, detectedMinsAgo: (24-r.hour)*60, source:'Citizen Report', id:r.id, status:r.status}));
  });
}

function chartBase(labels){

    responsive:true, maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{legend:{labels:{color:'#9AA6C8',font:{size:10.5}}},
      tooltip:{backgroundColor:'#0F1A3D',borderColor:'#233066',borderWidth:1,titleColor:'#EAF0FF',bodyColor:'#9AA6C8'}},
    scales:{ x:{ticks:{color:'#6C7699',font:{size:10}},grid:{color:'rgba(255,255,255,.05)'}},
             y:{ticks:{color:'#6C7699',font:{size:10}},grid:{color:'rgba(255,255,255,.05)'}} }
  }};
}
function renderHoursCharts(){
  if(!DB.hourly) return;

    if(charts[id]) charts[id].destroy();
    const ctx = document.getElementById(id); if(!ctx) return;
    const base = chartBase(labels);
    charts[id] = new Chart(ctx, {type, data:{labels, datasets}, options:base.options});
  };
  mk('chWeather',[
    {label:'Temp (°C)', data:DB.hourly.temp, borderColor:'#F0A83D', backgroundColor:'rgba(240,168,61,.1)', tension:.35, yAxisID:'y'},

        <button class="btn btn-ghost btn-sm" onclick="replayStep(1)">Next &gt;|</button>
        <div class="speedbtns">
          ${[0.5,1,2,5].map(s=>`<button data-s="${s}" class="${s===1?'sel':''}" onclick="setReplaySpeed(${s},this)">${s}×</button>`).join('')}

function initReplay(){ replayHour=0; replayPlaying=false; renderReplayFrame(); }
function replaySeek(v){ replayHour=parseInt(v); renderReplayFrame(); }
function replayStep(d){ replayHour=clamp(replayHour+d,0,23); document.getElementById('replaySlider').value=replayHour; renderReplayFrame(); }
function setReplaySpeed(s,btn){ replaySpeed=s; document.querySelectorAll('.speedbtns button').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); }
function replayToggle(){
  replayPlaying = !replayPlaying;
  document.getElementById('replayPlayBtn').textContent = replayPlaying? 'Ⅱ Pause':'▶ Play';
  if(replayPlaying){
    replayTimer = setInterval(()=>{
      replayHour++;
      if(replayHour>23){ replayHour=23; replayToggle(); return; }
      document.getElementById('replaySlider').value=replayHour;
      renderReplayFrame();
    }, 900/replaySpeed);
  } else clearInterval(replayTimer);
}
function renderReplayFrame(){
  if(!DB.hourly) return;
  const h = replayHour;
  const el = document.getElementById('replayStats'); if(!el) return;
  el.innerHTML = `
    <div class="statcard card card-tight"><div class="label">Time</div><div class="value" style="font-size:20px">${(DB.hourLabels||[])[h]||pad(h)+':00'}</div></div>
    <div class="statcard card card-tight"><div class="label">Weather</div><div class="value" style="font-size:20px">${DB.hourly.temp[h]}°C</div><div class="meta">Rain ${DB.hourly.rain[h]} mm</div></div>
    <div class="statcard card card-tight"><div class="label">Traffic</div><div class="value" style="font-size:20px">${DB.hourly.traffic[h]}%</div><div class="meta">delay vs baseline</div></div>

  `;
  if(h>=20 && DB.hourly.rain[h]>6){
    document.getElementById('replaySummary').textContent = `During the selected period, rainfall increased to ${DB.hourly.rain[h]} mm/h while citizen reports rose to ${DB.hourly.reports[h]} and traffic delay reached ${DB.hourly.traffic[h]}%. This is a detected pattern, not proof of causation.`;
  }
}

const ASK_SUGGESTIONS = [
  "What's happening near Sector 4?","Are there any major hazards nearby?","Why did the Civic Health Score change?",
  "What areas have increased traffic?","What happened in the last hour?","Is there a possible connection between rainfall and flooding?"
];
function renderAskView(){
  const el = document.getElementById('view-ask'); if(!el) return;
  el.innerHTML = `
    <div class="eyebrow">CONVERSATIONAL ASSISTANT</div>
    <h1 class="pagetitle">Ask CityPulse</h1>
    <p class="pagesub">Ask what's happening in your city. Answers are generated from CityPulse's current data — never invented.</p>
    <div class="card chatwrap">
      <div class="suggestrow">${ASK_SUGGESTIONS.map(q=>`<button onclick="askQuestion(\`${q}\`)">${q}</button>`).join('')}</div>
      <div class="chatlog" id="chatLog"></div>
      <div class="chatinput">
        <input id="chatInputEl" placeholder="Ask about your city…" onkeydown="if(event.key==='Enter')askQuestion(this.value)">
        <button class="btn btn-primary" onclick="askQuestion(document.getElementById('chatInputEl').value)">Send</button>
      </div>
    </div>
  `;
  if(!document.getElementById('chatLog').dataset.seeded){
    addChatMsg('bot', "Hi — I'm CityPulse. Ask me about hazards, traffic, weather or why the Civic Health Score changed.", null);
    document.getElementById('chatLog').dataset.seeded='1';
  }
}
function addChatMsg(who,text,dataUsed){
  const log = document.getElementById('chatLog'); if(!log) return;
  const div = document.createElement('div');
  div.className='msg '+who;
  div.innerHTML = text + (dataUsed? `<div class="datatag"><span>DATA USED: ${dataUsed.join(', ')}</span><span>LAST UPDATED: ${nowStr()}</span></div>`:'');
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
function askQuestion(q){
  q = (q||'').trim(); if(!q) return;
  document.getElementById('chatInputEl').value='';
  addChatMsg('user', escapeHtml(q));
  setTimeout(()=> answerQuestion(q), 500);
}
function escapeHtml(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function answerQuestion(q){
  const lq = q.toLowerCase();
  let answer, dataUsed;
  if(lq.includes('sector 4') || lq.includes('near sector')){
    const hz = DB.hazards.filter(h=>h.zone==='Sector 4');
    answer = hz.length ? `Sector 4 currently has ${hz.length} active hazard${hz.length>1?'s':''}, including ${hz[0].type.toLowerCase()} at ${hz[0].confidence}% AI confidence. ${DB.reports.filter(r=>r.zone==='Sector 4').length} citizen reports have been filed in this zone.`
      : `I don't see any active hazards in Sector 4 right now.`;
    dataUsed=['Citizen Reports','AI Detection'];
  } else if(lq.includes('hazard')){
    const top = [...DB.hazards].sort((a,b)=>b.confidence-a.confidence)[0];
    answer = top ? `The highest-confidence hazard right now is a ${top.type.toLowerCase()} in ${top.zone} (${top.confidence}% confidence, severity ${top.severity}), detected ${top.detectedMinsAgo} minutes ago.` : `No significant hazards are currently detected.`;
    dataUsed=['AI Detection','Citizen Reports'];
  } else if(lq.includes('civic health') || lq.includes('score')){
    const c = DB.civic;
    answer = `The Civic Health Score is ${c.score}/100 (${statusLabel(c.score)}), ${c.score>=c.prevScore?'up':'down'} from ${c.prevScore} earlier. The biggest factor is Traffic at ${c.cats['Traffic']}/100. This is a CityPulse composite indicator, not an official rating.`;
    dataUsed=['Weather','Traffic','Citizen Reports','Environment'];
  } else if(lq.includes('traffic')){
    answer = `Traffic delay is currently trending near ${DB.hourly.traffic[DB.hourly.traffic.length-1]}% above baseline, with the most congestion typically reported along Main Road and Sector 4.`;
    dataUsed=['Traffic Feed'];
  } else if(lq.includes('last hour') || lq.includes('happened')){
    answer = `In the last hour: ${DB.activity.slice(0,4).map(a=>a.text.toLowerCase()).join('; ')}.`;
    dataUsed=['Activity Log'];
  } else if(lq.includes('rainfall') && (lq.includes('flood')||lq.includes('waterlog'))){
    const li = DB.insights.find(i=>i.title==='PATTERN DETECTED');
    answer = li ? `${li.text} Confidence: ${li.confidence}%. This is a possible correlation based on available civic data, not a confirmed cause.` : `I don't have enough current data to answer that confidently.`;
    dataUsed=['Weather','Citizen Reports'];
  } else {
    answer = `I don't have enough current data to answer that confidently. Try asking about hazards, traffic, weather, or the Civic Health Score.`;
    dataUsed=null;
  }
  addChatMsg('bot', answer, dataUsed);
}

function showToast(emoji,title,body){
  const stack = document.getElementById('toastStack');
  const t = document.createElement('div'); t.className='toast';

async function fetchJSON(url,opts={},ms=12000){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),ms);

/* Index of the current local hour in an Open-Meteo hourly.time array, then the trailing 24 values */
function trailing24(j,arr){
  const now=new Date(Date.now()+(j.utc_offset_seconds||0)*1000).toISOString().slice(0,13)+':00';
  let i=j.hourly.time.indexOf(now); if(i<23) i=Math.min(j.hourly.time.length-1,47);
  const from=Math.max(0,i-23), fill=[]; let last=null;
  for(let k=from;k<=i;k++){ const v=arr[k]; last=(v==null?last:v); fill.push(last??0); }
  return {vals:fill,labels:j.hourly.time.slice(from,i+1).map(s=>s.slice(11,16))};
}
function recomputeCivicFromLive(){

  const vals=Object.values(DB.civic.cats), s=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  if(s!==DB.civic.score){ DB.civic.prevScore=DB.civic.score; DB.civic.score=s; }
}

  const t=trailing24(j,j.hourly.temperature_2m), r=trailing24(j,j.hourly.precipitation);
  DB.hourly.temp=t.vals.map(v=>Math.round(v*10)/10); DB.hourly.rain=r.vals.map(v=>Math.round(v*10)/10);

async function fetchAirQuality(){

  if(_liveBusy) return; _liveBusy=true;
  try{
    await Promise.allSettled([fetchWeather(),fetchWeather24().catch(()=>{DB.hourlyLive=false;}),fetchAirQuality(),withOSM?fetchOSM():Promise.resolve()]);
    recomputeCivicFromLive();
    if(DB.weatherSource==='LIVE') pushActivity('Weather updated — Open-Meteo','var(--teal)');
    if(LIVE.aq.status==='LIVE') pushActivity(`Air quality updated — AQI ${DB.aq.aqi} (Open-Meteo)`,'var(--teal)');
    if(currentView==='home') renderHome(); else renderStatusCards();
    renderStatusBar(); renderFeedsView(); if(currentView==='hours') renderHoursCharts();
  } finally { _liveBusy=false; }
}
/* changing location must refetch everything */
(function(){ const _cl=changeLocation; changeLocation=function(k){ _cl(k); DB.aq=null; DB.osm=[]; refreshLive(true); }; })();

/* Feed status now reflects real request results */
computeFeeds=function(){
  const wLive=DB.weatherSource==='LIVE';
  const feeds=[
    {name:'Weather',source:'Open-Meteo Forecast API',status:wLive?'LIVE':'SIMULATED',updated:DB.weatherUpdated?timeAgo(DB.weatherUpdated):'—',type:'Environmental',err:wLive?null:'Open-Meteo unreachable — showing simulated values'},
    {name:'Air Quality',source:LIVE.aq.source,status:LIVE.aq.status==='LIVE'?'LIVE':LIVE.aq.status==='PENDING'?'SIMULATED':'UNAVAILABLE',updated:LIVE.aq.updated?timeAgo(LIVE.aq.updated):'—',type:'Environmental',err:LIVE.aq.err},
    {name:'Map Data',source:'OpenStreetMap tiles',status:'AVAILABLE',updated:'on demand',type:'Geographic',err:null},
    {name:'Emergency Services',source:LIVE.osm.source,status:LIVE.osm.status==='LIVE'?'LIVE':LIVE.osm.status==='PENDING'?'SIMULATED':'UNAVAILABLE',updated:LIVE.osm.updated?timeAgo(LIVE.osm.updated):'—',type:'Geographic',err:LIVE.osm.err},
    {name:'Geocoding',source:LIVE.geo.source,status:LIVE.geo.status==='LIVE'?'LIVE':'AVAILABLE',updated:LIVE.geo.updated?timeAgo(LIVE.geo.updated):'on search',type:'Geographic',err:LIVE.geo.err},
    {name:'Citizen Reports',source:'In-browser demo store (no backend yet)',status:'SIMULATED',updated:'this session',type:'User-generated',err:null},
    {name:'AI Detection',source:'CityPulse Vision (mock model)',status:'SIMULATED',updated:'on demand',type:'AI Inference',err:null},
    {name:'Traffic',source:'Demo feed — no free public API',status:'SIMULATED',updated:'—',type:'Simulated',err:'Needs a keyed provider (e.g. TomTom/HERE) via a backend proxy'},
    {name:'Civic Data',source:'Demo Feed',status:'SIMULATED',updated:'—',type:'Simulated',err:null},
  ];
  DB.feedsHealthy=feeds.filter(f=>f.status==='LIVE'||f.status==='AVAILABLE').length;
  return feeds;
};
renderFeedsView=function(){
  const el=document.getElementById('view-feeds'); if(!el) return;
  const feeds=computeFeeds();
  const col=s=>s==='LIVE'?'var(--teal)':s==='AVAILABLE'?'var(--blue)':s==='UNAVAILABLE'?'var(--red)':'var(--txt-faint)';
  const pill=s=>s==='LIVE'?'pill-good':s==='UNAVAILABLE'?'pill-bad':'pill-info';
  el.innerHTML=`<div class="eyebrow">SYSTEM TRANSPARENCY</div><h1 class="pagetitle">Feed Status</h1>
   <p class="pagesub">Status reflects real requests made by this page. If a feed fails, it is shown as unavailable or simulated, and the rest of CityPulse keeps working.</p>
   <div class="grid g3">${feeds.map(f=>`<div class="card feedcard">
     <div class="fh"><b>${f.name}</b><span class="pill ${pill(f.status)}"><span class="status-dot" style="background:${col(f.status)}"></span>${f.status}</span></div>
     <div style="font-size:12.5px;color:var(--txt-dim)">${f.source}</div>
     <div style="font-size:11.5px;color:var(--txt-faint)">Type: ${f.type} · Updated ${f.updated}</div>
     <div style="font-size:11.5px;color:${f.err?'var(--amber)':'var(--txt-faint)'}">${f.err?'Note: '+escapeHtml(f.err):'Error state: none'}</div>
     <button class="btn btn-ghost btn-sm" style="align-self:flex-start;margin-top:4px" onclick="retryFeed('${f.name}')">Retry</button></div>`).join('')}</div>`;
};
retryFeed=function(name){
  const done=()=>{ renderFeedsView(); renderStatusBar(); };
  if(name==='Weather'||name==='Air Quality') refreshLive(false).then(done);
  else if(name==='Emergency Services') fetchOSM().then(done);
  else if(name==='Geocoding') geocode(DB.loc.name.split(',')[0]).then(done);
  else { pushActivity(`${name}: no live source is connected`,'var(--amber)'); done(); }
};

/* Hours page: honest provenance note */
(function(){
  const _rh=renderHoursView;
  renderHoursView=function(){
    _rh(); const v=document.getElementById('view-hours'); if(!v) return;
    const a=DB.hourlyLive?'<span class="source-tag src-live"><span class="d"></span>LIVE — Open-Meteo</span>':'<span class="source-tag src-sim"><span class="d"></span>SIMULATED</span>';
    const b=DB.aqiSeriesLive?'<span class="source-tag src-live"><span class="d"></span>LIVE — Open-Meteo Air Quality</span>':'<span class="source-tag src-sim"><span class="d"></span>SIMULATED</span>';
    v.insertAdjacentHTML('afterbegin',`<div style="font-size:12px;color:var(--txt-dim);margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">Data provenance — Temperature &amp; rain: ${a} · AQI: ${b} · Traffic, reports, hazards, civic health: <span class="source-tag src-sim"><span class="d"></span>SIMULATED</span></div>`);
  };
})();

/* Real geolocation + reverse geocoding for reports */
let __repCoords=null;
useCurrentLocation=function(){
  const inp=document.getElementById('repLoc');
  if(!navigator.geolocation){ inp.placeholder='Geolocation not supported'; return; }
  inp.value='Locating…';
  navigator.geolocation.getCurrentPosition(async p=>{
    __repCoords={lat:p.coords.latitude,lon:p.coords.longitude};
    try{
      const j=await fetchJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&lat=${__repCoords.lat}&lon=${__repCoords.lon}`);
      const a=j.address||{}; inp.value=[a.road,a.suburb||a.neighbourhood,a.city||a.town].filter(Boolean).join(', ')||'Current location';
      Object.assign(LIVE.geo,{status:'LIVE',updated:new Date(),err:null});
    }catch(e){ inp.value='Current location ('+__repCoords.lat.toFixed(4)+', '+__repCoords.lon.toFixed(4)+')'; }
  },()=>{ inp.value=''; inp.placeholder='Location permission denied — type a place instead'; },{enableHighAccuracy:true,timeout:10000});
};
(function(){
  const _sr=submitReport;
  submitReport=function(){
    const n=DB.reports.length; _sr();
    if(__repCoords&&DB.reports.length>n){ DB.reports[0].lat=__repCoords.lat; DB.reports[0].lon=__repCoords.lon; __repCoords=null; if(map) plotHazardsOnMap(); }
  };
})();

/* Search any place on Earth via Nominatim (press Enter) */
__ui.push(function(){
  const inp=document.getElementById('gsInput'), res=document.getElementById('gsRes'); if(!inp) return;
  inp.addEventListener('keydown',async e=>{
    if(e.key!=='Enter'||!inp.value.trim()) return;
    res.innerHTML='<div style="padding:10px;font-size:12px;color:var(--txt-faint)">Searching OpenStreetMap…</div>'; res.style.display='block';
    const hits=await geocode(inp.value.trim());
    res.innerHTML=hits.length?hits.map((h,i)=>`<button data-i="${i}"><b>🌐 ${escapeHtml(h.name.split(',').slice(0,2).join(','))}</b><small>Set as location · OpenStreetMap Nominatim</small></button>`).join(''):'<div style="padding:10px;font-size:12px;color:var(--txt-faint)">No places found (or geocoder unavailable).</div>';
    res.querySelectorAll('button').forEach(b=>b.onclick=()=>{res.style.display='none';inp.value='';const h=hits[b.dataset.i];setCustomLocation(h.lat,h.lon,h.name);});
  });
});

/* keep data fresh: Open-Meteo updates ~every 15 min, so poll every 5 min */
setInterval(()=>refreshLive(false),300000);
(function(){ const _b=boot; boot=async function(){ await _b(); refreshLive(true); }; })();

boot();
</script>
